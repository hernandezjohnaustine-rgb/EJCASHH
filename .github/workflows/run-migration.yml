name: Commission Data Migration (Manual)

# This workflow NEVER runs automatically — it only runs when you manually
# click "Run workflow" from the Actions tab and choose a mode.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose which script to run and whether to write changes."
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
          - realign-dry-run
          - realign-apply
          - backfill-referrals-dry-run
          - backfill-referrals-apply
          - fix-send-money-dry-run
          - fix-send-money-apply
          - audit-office-transfers
          - add-referral-chain-dry-run
          - add-referral-chain-apply
          - check-original-referrer-gaps
          - extend-referral-chain-dry-run
          - extend-referral-chain-apply
          - check-reroot-to-jpower03
          - reroot-matrix-dry-run
          - reroot-matrix-apply
          - check-matrix-width-violations
          - fix-matrix-width-dry-run
          - fix-matrix-width-apply
          - check-matrix-depth-map
          - reflow-matrix-dry-run
          - reflow-matrix-apply
          - exclude-backbone-dry-run
          - exclude-backbone-apply
          - backfill-original-referrer-dry-run
          - backfill-original-referrer-apply
          - check-jpower03-chain
          - connect-jpower03-dry-run
          - connect-jpower03-apply
          - check-ejcashh02-collision
          - check-jerry-pendoro-status
          - move-jerry-pendoro-dry-run
          - move-jerry-pendoro-apply
          - referral-bonus-12-20-dry-run
          - referral-bonus-12-20-apply

jobs:
  run_migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install firebase-admin

      - name: Write service account key from secret
        working-directory: scripts
        run: echo "${{ secrets.FIRESTORE_ADMIN_KEY_B64 }}" | base64 -d > serviceAccountKey.json

      - name: Verify service account key was written correctly
        working-directory: scripts
        run: |
          if [ ! -s serviceAccountKey.json ]; then
            echo "ERROR: serviceAccountKey.json is empty. The FIRESTORE_ADMIN_KEY_B64 secret may be missing, misnamed, or empty."
            exit 1
          fi
          echo "Key file size: $(wc -c < serviceAccountKey.json) bytes"
          # Confirm it's valid JSON without printing the sensitive content
          node -e "JSON.parse(require('fs').readFileSync('serviceAccountKey.json')); console.log('Key file is valid JSON.')"

      - name: Backup users + transactions before any changes
        working-directory: scripts
        run: node backup-firestore.mjs

      - name: Upload backup as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ github.run_id }}
          path: |
            scripts/backup-users.json
            scripts/backup-transactions.json
          retention-days: 30

      - name: Run commission migration (dry-run)
        if: ${{ github.event.inputs.mode == 'dry-run' }}
        working-directory: scripts
        run: node fix-commission-data.mjs

      - name: Run commission migration (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'apply' }}
        working-directory: scripts
        run: node fix-commission-data.mjs --apply

      - name: Run placement + Credits realignment (dry-run)
        if: ${{ github.event.inputs.mode == 'realign-dry-run' }}
        working-directory: scripts
        run: node realign-placement-and-credits.mjs

      - name: Run placement + Credits realignment (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'realign-apply' }}
        working-directory: scripts
        run: node realign-placement-and-credits.mjs --apply

      - name: Backfill missing referralCodes lookup docs (dry-run)
        if: ${{ github.event.inputs.mode == 'backfill-referrals-dry-run' }}
        working-directory: scripts
        run: node backfill-referral-codes.mjs

      - name: Backfill missing referralCodes lookup docs (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'backfill-referrals-apply' }}
        working-directory: scripts
        run: node backfill-referral-codes.mjs --apply

      - name: Fix duplicate Send Money deductions (dry-run)
        if: ${{ github.event.inputs.mode == 'fix-send-money-dry-run' }}
        working-directory: scripts
        run: node fix-duplicate-send-money.mjs

      - name: Fix duplicate Send Money deductions (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'fix-send-money-apply' }}
        working-directory: scripts
        run: node fix-duplicate-send-money.mjs --apply

      - name: Audit Office transfers (read-only)
        if: ${{ github.event.inputs.mode == 'audit-office-transfers' }}
        working-directory: scripts
        run: node audit-office-transfers.mjs

      - name: Add referral chain (Level 2-10) + relabel matrix to 11-20 (dry-run)
        if: ${{ github.event.inputs.mode == 'add-referral-chain-dry-run' }}
        working-directory: scripts
        run: node add-referral-chain-and-relabel-matrix.mjs

      - name: Add referral chain (Level 2-10) + relabel matrix to 11-20 (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'add-referral-chain-apply' }}
        working-directory: scripts
        run: node add-referral-chain-and-relabel-matrix.mjs --apply

      - name: Check originalReferrerId gaps (read-only)
        if: ${{ github.event.inputs.mode == 'check-original-referrer-gaps' }}
        working-directory: scripts
        run: node check-original-referrer-gaps.mjs

      - name: Extend referral chain to Level 11 (dry-run)
        if: ${{ github.event.inputs.mode == 'extend-referral-chain-dry-run' }}
        working-directory: scripts
        run: node extend-referral-chain-to-11.mjs

      - name: Extend referral chain to Level 11 (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'extend-referral-chain-apply' }}
        working-directory: scripts
        run: node extend-referral-chain-to-11.mjs --apply

      - name: Check re-root to JPOWER03 feasibility (read-only)
        if: ${{ github.event.inputs.mode == 'check-reroot-to-jpower03' }}
        working-directory: scripts
        run: node check-reroot-to-jpower03.mjs

      - name: Re-root matrix to JPOWER03 (dry-run)
        if: ${{ github.event.inputs.mode == 'reroot-matrix-dry-run' }}
        working-directory: scripts
        run: node reroot-matrix-to-jpower03.mjs

      - name: Re-root matrix to JPOWER03 (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'reroot-matrix-apply' }}
        working-directory: scripts
        run: node reroot-matrix-to-jpower03.mjs --apply

      - name: Check matrix width violations (read-only)
        if: ${{ github.event.inputs.mode == 'check-matrix-width-violations' }}
        working-directory: scripts
        run: node check-matrix-width-violations.mjs

      - name: Fix matrix width violations (dry-run)
        if: ${{ github.event.inputs.mode == 'fix-matrix-width-dry-run' }}
        working-directory: scripts
        run: node fix-matrix-width-violations.mjs

      - name: Fix matrix width violations (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'fix-matrix-width-apply' }}
        working-directory: scripts
        run: node fix-matrix-width-violations.mjs --apply

      - name: Check matrix depth map (read-only)
        if: ${{ github.event.inputs.mode == 'check-matrix-depth-map' }}
        working-directory: scripts
        run: node check-matrix-depth-map.mjs

      - name: Reflow matrix with full BFS (dry-run)
        if: ${{ github.event.inputs.mode == 'reflow-matrix-dry-run' }}
        working-directory: scripts
        run: node reflow-matrix-full-bfs.mjs

      - name: Reflow matrix with full BFS (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'reflow-matrix-apply' }}
        working-directory: scripts
        run: node reflow-matrix-full-bfs.mjs --apply

      - name: Exclude EJCASHH backbone from matrix (dry-run)
        if: ${{ github.event.inputs.mode == 'exclude-backbone-dry-run' }}
        working-directory: scripts
        run: node exclude-ejcashh-backbone-from-matrix.mjs

      - name: Exclude EJCASHH backbone from matrix (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'exclude-backbone-apply' }}
        working-directory: scripts
        run: node exclude-ejcashh-backbone-from-matrix.mjs --apply

      - name: Backfill originalReferrerId (dry-run)
        if: ${{ github.event.inputs.mode == 'backfill-original-referrer-dry-run' }}
        working-directory: scripts
        run: node backfill-original-referrer-id.mjs

      - name: Backfill originalReferrerId (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'backfill-original-referrer-apply' }}
        working-directory: scripts
        run: node backfill-original-referrer-id.mjs --apply

      - name: Check JPOWER03 chain (read-only)
        if: ${{ github.event.inputs.mode == 'check-jpower03-chain' }}
        working-directory: scripts
        run: node check-jpower03-chain.mjs

      - name: Connect JPOWER03 to EJCASHH11 (dry-run)
        if: ${{ github.event.inputs.mode == 'connect-jpower03-dry-run' }}
        working-directory: scripts
        run: node connect-jpower03-to-ejcashh11.mjs

      - name: Connect JPOWER03 to EJCASHH11 (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'connect-jpower03-apply' }}
        working-directory: scripts
        run: node connect-jpower03-to-ejcashh11.mjs --apply

      - name: Check EJCASHH02 collision (read-only)
        if: ${{ github.event.inputs.mode == 'check-ejcashh02-collision' }}
        working-directory: scripts
        run: node check-ejcashh02-collision.mjs

      - name: Check Jerry Pendoro status (read-only)
        if: ${{ github.event.inputs.mode == 'check-jerry-pendoro-status' }}
        working-directory: scripts
        run: node check-jerry-pendoro-status.mjs

      - name: Move Jerry Pendoro to JPOWER03 (dry-run)
        if: ${{ github.event.inputs.mode == 'move-jerry-pendoro-dry-run' }}
        working-directory: scripts
        run: node move-jerry-pendoro-to-jpower03.mjs

      - name: Move Jerry Pendoro to JPOWER03 (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'move-jerry-pendoro-apply' }}
        working-directory: scripts
        run: node move-jerry-pendoro-to-jpower03.mjs --apply

      - name: Add Referral Chain Bonus Level 12-20 (dry-run)
        if: ${{ github.event.inputs.mode == 'referral-bonus-12-20-dry-run' }}
        working-directory: scripts
        run: node add-referral-chain-bonus-12-20.mjs

      - name: Add Referral Chain Bonus Level 12-20 (APPLY — writes real changes)
        if: ${{ github.event.inputs.mode == 'referral-bonus-12-20-apply' }}
        working-directory: scripts
        run: node add-referral-chain-bonus-12-20.mjs --apply

      - name: Clean up service account key
        if: always()
        working-directory: scripts
        run: rm -f serviceAccountKey.json

